<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <link rel="icon" href="icon/icon.png" type="image/png">
        <link rel="apple-touch-icon" href="icon/icon.png">
        <link rel="stylesheet" type="text/css" href="fonts/gamefont.css">
        <style>
            html, body {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                overflow: hidden;
                background: #000;
            }

            canvas, video {
                display: block;
            }
        </style>
        <title>BLOODMONEY!</title>
    </head>
    <body>
        <script type="text/javascript" src="js/libs/pixi.js"></script>
        <script type="text/javascript" src="js/libs/pixi-tilemap.js"></script>
        <script type="text/javascript" src="js/libs/pixi-picture.js"></script>
        <script type="text/javascript" src="js/libs/fpsmeter.js"></script>
        <script type="text/javascript" src="js/libs/lz-string.js"></script>
        <script type="text/javascript" src="js/libs/iphone-inline-video.browser.js"></script>
        <script type="text/javascript" src="js/rpg_core.js"></script>
        <script type="text/javascript" src="js/rpg_managers.js"></script>
        <script type="text/javascript" src="js/rpg_objects.js"></script>
        <script type="text/javascript" src="js/rpg_scenes.js"></script>
        <script type="text/javascript" src="js/rpg_sprites.js"></script>
        <script type="text/javascript" src="js/rpg_windows.js"></script>
        <script type="text/javascript" src="js/plugins.js"></script>

        <script type="text/javascript">
            (function () {
                var lastLog = "";

                function bloodmoneyFitLog(reason) {
                    var canvas = document.getElementById("GameCanvas");
                    var message = [
                        "[BLOODMONEY DEBUG] " + reason,
                        "viewport=" + window.innerWidth + "x" + window.innerHeight,
                        "screen=" + window.screen.width + "x" + window.screen.height,
                        "document=" + document.documentElement.clientWidth + "x" + document.documentElement.clientHeight,
                        "gameLogical=" + (typeof Graphics !== "undefined" ? Graphics.width + "x" + Graphics.height : "unknown"),
                        "stretch=" + (typeof Graphics !== "undefined" ? String(Graphics._stretchEnabled) : "unknown"),
                        "realScale=" + (typeof Graphics !== "undefined" ? String(Graphics._realScale) : "unknown"),
                        "canvasCss=" + (canvas ? canvas.style.width + "x" + canvas.style.height : "missing"),
                        "canvasAttr=" + (canvas ? canvas.width + "x" + canvas.height : "missing"),
                        "canvasRect=" + (canvas ? Math.round(canvas.getBoundingRect ? canvas.getBoundingRect().width : canvas.getBoundingClientRect().width) + "x" + Math.round(canvas.getBoundingClientRect().height) : "missing")
                    ].join(" | ");

                    if (message !== lastLog) {
                        console.log(message);
                        lastLog = message;
                    }
                }

                function bloodmoneyFit() {
                    if (typeof Graphics === "undefined") return;

                    Graphics._stretchEnabled = true;

                    if (typeof Graphics._updateRealScale === "function") {
                        Graphics._updateRealScale();
                    }
                    if (typeof Graphics._updateAllElements === "function") {
                        Graphics._updateAllElements();
                    }

                    bloodmoneyFitLog("resize/update");
                }

                // Log immediately after loading this script and after the engine initializes.
                bloodmoneyFitLog("index-script-loaded");

                window.addEventListener("resize", bloodmoneyFit);
                window.addEventListener("load", function () {
                    bloodmoneyFit();
                    setTimeout(function () { bloodmoneyFit(); bloodmoneyFitLog("1s-after-load"); }, 1000);
                });

                setInterval(function () {
                    bloodmoneyFitLog("periodic-check");
                }, 3000);
            })();
        </script>

        <script type="text/javascript" src="js/main.js"></script>
    </body>
</html>
